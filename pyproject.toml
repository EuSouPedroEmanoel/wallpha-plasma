[project]
name = "wallp-plasma"
version = "1.0.2"
description = "wallp Plasma backend — daemon + plasmóide unificado imagem+vídeo (KDE Plasma 6)"
requires-python = ">=3.10"
dependencies = [
    "dbus-python>=1.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wallp*"]

[tool.setuptools.package-data]
wallp = ["assets/*"]

[project.scripts]
wallp-plasma-daemon = "wallp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
