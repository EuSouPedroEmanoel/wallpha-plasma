[project]
name = "wallpha-plasma"
version = "2.2.0"
description = "wallpha Plasma backend — daemon + plasmóide unificado imagem+vídeo (KDE Plasma 6)"
requires-python = ">=3.10"
dependencies = [
    "dbus-python>=1.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wallpha*"]

[tool.setuptools.package-data]
wallpha = ["assets/*"]

[project.scripts]
wallpha-plasma-daemon = "wallpha:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
